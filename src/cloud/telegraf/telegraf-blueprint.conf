[agent]
  interval = "10s"
  round_interval = true

###############################################################################
# MQTT INPUT (from Raspberry Pico W)
###############################################################################
[[inputs.mqtt_consumer]]
  servers = []
  topics = [
    "iiot/group/+/sensor/temperature",
    "iiot/group/+/sensor/humidity",
  ]
  username = 
  password = 

  qos = 0
  connection_timeout = "30s"
  persistent_session = false
  client_id = "telegraf-mqtt"
  
  data_format = "json"
  tag_keys = ["sensor_id"]
  json_string_fields = ["unit", "status"]
  
###############################################################################
# OUTPUT: InfluxDB v2
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = 
  organization = "sensors"
  bucket = "sensor_data"
