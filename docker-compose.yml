services:
  influxdb2:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/influxdb2-admin-username
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influxdb2-admin-password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influxdb2-admin-token
      DOCKER_INFLUXDB_INIT_ORG: sensors
      DOCKER_INFLUXDB_INIT_BUCKET: sensor_data
    secrets:
      - influxdb2-admin-username
      - influxdb2-admin-password
      - influxdb2-admin-token
    volumes:
      - ./src/cloud/influx/data:/var/lib/influxdb2
      - ./src/cloud/influx/config:/etc/influxdb2

  telegraf:
    image: telegraf:1.30
    depends_on:
      - influxdb2
    environment:
      - INFLUXDB_HOST=influxdb2
      - INFLUXDB_TOKEN="todo_generate_token"
      - INFLUXDB_ORG=local_org
      - INFLUXDB_BUCKET=sensor_bucket
      - TELEGRAF_COLLECTION_INTERVAL=5s
      - HOSTNAME=telegraf
    volumes:
      - ./src/cloud/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    volumes:
      - ./src/cloud/grafana/data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb2

secrets:
  influxdb2-admin-username:
    file: ./.env.influxdb2-admin-username
  influxdb2-admin-password:
    file: ./.env.influxdb2-admin-password
  influxdb2-admin-token:
    file: ./.env.influxdb2-admin-token
    
volumes:
  influxdb2-data:
  influxdb2-config:
  # grafana_data:
